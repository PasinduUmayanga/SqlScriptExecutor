version: 1.0.{build}

image: Visual Studio 2022

configuration: Release

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

cache:
  - '%USERPROFILE%\.nuget\packages -> **\*.csproj'

before_build:
  - dotnet --info
  - dotnet restore SqlScriptExecutor.sln

build_script:
  - dotnet build SqlScriptExecutor.sln --configuration %CONFIGURATION% --no-restore

test_script:
  - dotnet test SqlScriptExecutor.sln --configuration %CONFIGURATION% --no-build --verbosity normal
  - dotnet list SqlScriptExecutor.sln package --vulnerable --include-transitive

artifacts:
  - path: SSE.Forms\bin\Release\net8.0-windows
    name: SqlScriptExecutor
